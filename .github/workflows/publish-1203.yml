name: Publish 1.20.3 APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1203.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build APK
        run: |
          test -n "$AMAP_ANDROID_KEY" || { echo "::error::Missing AMAP_ANDROID_KEY"; exit 1; }
          printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
          bash gradlew assembleDebug testDebugUnitTest
      - name: Verify APK
        run: |
          set -eu
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/manifest.txt
          grep -Fq -- "$AMAP_ANDROID_KEY" /tmp/manifest.txt
          rm -f /tmp/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/apk-info.txt
          grep -F "package: name='io.github.xieyinch.locationsimulator'" /tmp/apk-info.txt
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" location-simulator-1.20.3-arm64.apk
      - name: Publish tested APK
        run: |
          cat > release-notes.md <<'NOTES'
          ## 位置模拟 1.20.3 测试版

          支持路线循环次数和终点返回起点；模拟开始后按钮变为停止，运行时可快速切换选中位置。路线、收藏与摇杆移至地图上方快捷控制。增加可选系统 fused 定位通道。

          已通过 Android 模拟器 GPS 坐标接收测试；实际手机和目标应用仍需验证。包名和签名不变，可尝试覆盖安装并保留本应用设置。高德 Key 从仓库构建配置或原有应用设置读取。
          NOTES
          gh release create v1.20.3-beta.1 location-simulator-1.20.3-arm64.apk --target "$GITHUB_SHA" --title "位置模拟 1.20.3 路线与定位优化测试版" --notes-file release-notes.md --prerelease

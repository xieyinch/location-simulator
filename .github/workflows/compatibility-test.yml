name: Android compatibility smoke test
on:
  push:
    branches: [codex/portal-integration-ios]
    paths: [.github/workflows/compatibility-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7dc5442ecb475891e49d33a04e78395f7b4ca2bb
          path: old-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build old and new emulator APKs
        run: |
          printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
          cp local.properties old-version/local.properties
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('app/build.gradle'), Path('old-version/app/build.gradle')]:
              s = path.read_text()
              s = s.replace('abiFilters "arm64-v8a"', 'abiFilters "arm64-v8a", "x86_64"')
              s = s.replace(r'..\\keystore\\GoGoGo.jks', '../keystore/GoGoGo.jks')
              path.write_text(s)
          path = Path('app/src/main/AndroidManifest.xml')
          s = path.read_text().replace('android:name="com.zcshou.gogogo.FreeSimulationService" android:exported="false"', 'android:name="com.zcshou.gogogo.FreeSimulationService" android:exported="true"')
          path.write_text(s)
          PY
          # Test-only x86_64 stub: AMap ships ARM libraries; this smoke test never initializes AMap.
          mkdir -p app/src/main/jniLibs/x86_64
          printf 'void compatibility_stub(void) {}' | gcc -nostdlib -shared -fPIC -x c - -o app/src/main/jniLibs/x86_64/libcompatibility_test.so
          bash gradlew assembleDebug
          (cd old-version && bash gradlew assembleDebug)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r old-version/app/build/outputs/apk/debug/*.apk
            adb install -r app/build/outputs/apk/debug/*.apk
            adb shell pm list packages | grep -q 'package:com.zcshou.gogogo'
            adb shell pm list packages | grep -q 'package:io.github.xieyinch.locationsimulator'
            adb shell appops set io.github.xieyinch.locationsimulator android:mock_location allow
            adb logcat -c
            adb shell am start -W -n io.github.xieyinch.locationsimulator/com.zcshou.gogogo.FreeMapActivity
            sleep 12
            adb shell pidof io.github.xieyinch.locationsimulator
            adb shell "am start-foreground-service -n io.github.xieyinch.locationsimulator/com.zcshou.gogogo.FreeSimulationService --es points '[{\"lat\":34.23,\"lon\":108.94},{\"lat\":34.231,\"lon\":108.94}]'"
            sleep 5
            adb shell dumpsys activity services | grep -q 'io.github.xieyinch.locationsimulator/com.zcshou.gogogo.FreeSimulationService'
            adb logcat -d -s AndroidRuntime:E > runtime.log
            if grep -q 'FATAL EXCEPTION' runtime.log; then cat runtime.log; exit 1; fi

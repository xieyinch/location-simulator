name: Import GoGoGo source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Import upstream project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: ZCShou/GoGoGo
          ref: 96139eee5e2e174901464d42eeaf67b00f9229f4
          path: upstream-source
          persist-credentials: false
      - name: Apply preliminary changes
        run: |
          cd upstream-source
          git apply --ignore-space-change --ignore-whitespace ../bootstrap/search-favorites.patch
      - name: Import source
        run: |
          cp upstream-source/README.md UPSTREAM_README.md
          tar -C upstream-source --exclude=.git --exclude=.github --exclude=README.md -cf - . | tar -xf -
          rm -rf upstream-source
          cat > README.md <<'EOF'
          # location-simulator
          
          基于 [ZCShou/GoGoGo](https://github.com/ZCShou/GoGoGo) 公开源码进行二次开发，基线提交为 96139eee5e2e174901464d42eeaf67b00f9229f4。源代码中的应用版本为 1.12.3，并非 VirtGO 2.5.2。
          
          当前包含位置收藏及搜索范围的初步修改；尚未完成构建、百度地图搜索或真机定位验证。搜索故障原因尚待排查。
          
          构建需配置百度地图开发者 Key 与安全码，匹配应用包名和签名；请通过本地配置或 GitHub Secrets 保存，不要提交密钥。
          
          原项目说明见 [UPSTREAM_README.md](UPSTREAM_README.md)，本项目遵循 [GPL-3.0-only](LICENSE)。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import upstream source and preliminary changes"
          git push origin HEAD:main

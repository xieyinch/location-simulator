name: Design A Android UI check
on:
  push:
    branches: [codex/design-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build emulator package
        run: |
          printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "arm64-v8a", "x86_64"/' app/build.gradle
          mkdir -p app/libs/x86_64
          printf 'void compatibility_stub(void) {}\n' | gcc -nostdlib -shared -fPIC -x c - -o app/libs/x86_64/libcompatibility_test.so
          bash gradlew :app:assembleDebug :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk
            python3 scripts/check_design_a.py

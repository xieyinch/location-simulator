name: Mock authorization and location test
on:
  push:
    branches: [main, codex/mock-authorization-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-location:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare emulator-only ABI
        run: |
          printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "arm64-v8a", "x86_64"/' app/build.gradle
          mkdir -p app/libs/x86_64
          printf 'void compatibility_stub(void) {}\n' | gcc -nostdlib -shared -fPIC -x c - -o app/libs/x86_64/libcompatibility_test.so
      - name: Build app and tests
        run: bash gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk
            adb install -r app/build/outputs/apk/androidTest/debug/*.apk
            adb shell settings put secure location_mode 3
            adb shell pm grant io.github.xieyinch.locationsimulator android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant io.github.xieyinch.locationsimulator android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant io.github.xieyinch.locationsimulator android.permission.ACCESS_BACKGROUND_LOCATION
            adb shell appops set io.github.xieyinch.locationsimulator android:mock_location allow
            adb shell am instrument -w -e class com.zcshou.gogogo.MockLocationInstrumentedTest io.github.xieyinch.locationsimulator.test/androidx.test.runner.AndroidJUnitRunner > instrument-output.txt
            cat instrument-output.txt
            grep -Fq 'OK (2 tests)' instrument-output.txt

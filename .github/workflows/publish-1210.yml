name: Publish 1.21.0 APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1210.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build APK
        run: |
          test -n "$AMAP_ANDROID_KEY" || { echo "::error::Missing AMAP_ANDROID_KEY"; exit 1; }
          printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
          bash gradlew assembleDebug testDebugUnitTest
      - name: Verify APK
        run: |
          set -eu
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/manifest.txt
          grep -Fq -- "$AMAP_ANDROID_KEY" /tmp/manifest.txt
          rm -f /tmp/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/apk-info.txt
          grep -F "package: name='io.github.xieyinch.locationsimulator'" /tmp/apk-info.txt
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" location-simulator-1.21.0-arm64.apk
      - name: Publish tested APK
        run: |
          cat > release-notes.md <<'NOTES'
          ## 迹点 1.21.0 兼容测试版

          地图顶部支持直接输入搜索，结果在地图页面内显示。尝试增加系统融合定位通道及定位监听，保留原有 GPS 和网络通道，定位状态会显示融合通道提交情况。

          不需要 Root；是否能改善微信或小程序定位依设备与应用版本而异，请在实际手机验证。包名与签名保持不变。
          NOTES
          gh release create v1.21.0-beta.1 location-simulator-1.21.0-arm64.apk --target "$GITHUB_SHA" --title "迹点 1.21.0 定位兼容测试版" --notes-file release-notes.md --prerelease

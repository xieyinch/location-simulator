name: Android APK
on:
  push:
    branches: [main, codex/portal-integration-ios]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure legacy build placeholders
        run: printf 'MAPS_API_KEY=unused\nMAPS_SAFE_CODE=unused\n' > local.properties
      - name: Build and test
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
        run: bash gradlew assembleDebug testDebugUnitTest
      - name: Verify APK identity and architecture
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > apk-info.txt
          grep -F "package: name='io.github.xieyinch.locationsimulator'" apk-info.txt
          unzip -Z1 "$apk" > apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: location-simulator-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
